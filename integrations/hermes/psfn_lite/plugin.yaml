name: psfn_lite
version: 0.1.0
description: "PSFN Lite as the companion's one authoritative continuity: every root turn prepared, settled and checkpointed through the Lite lifecycle bridge; governed tools over the psfn_lite MCP server."
hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - post_llm_call
  - on_session_end
  - on_session_finalize
  - subagent_start
# The llm_request middleware applies the companion's explicit tool requests to Hermes's provider request (toolchoice.py).
provides_middleware:
  - llm_request
